  <body>
    <h1>Transmission model in JS</h1>
    <script>
      var LotkaVolterra = function(a, b, c, d) {
        return function(x, y) {
          return [
          a * y[0] - b * y[0] * y[1],
          c * y[0] * y[1] - d * y[1]
          ];
        };
    };

      var s = new Solver(2);

      s.solve(LotkaVolterra(2/3, 4/3, 1, 1), 0, [1, 1], 6).y
    </script>
  </body>
